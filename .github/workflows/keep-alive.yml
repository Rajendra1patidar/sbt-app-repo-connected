name: SBT Keep Awake (backup)

# cron-job.org is the main keep-alive pinger (setup in BACKUPS.md). This workflow is the
# backup, so it pings half as often (every 30 minutes): that is plenty to catch the gaps if
# cron-job.org ever stops, and it uses far fewer of GitHub's free Actions minutes.
# (To go back to every 10 minutes, use the three cron lines in git history for this file.)
on:
  schedule:
    # GitHub cron is UTC. IST = UTC + 5:30.
    # These 3 lines together = every 30 minutes, 8:00 AM to 6:00 PM IST.
    - cron: "30 2 * * *"        # 8:00 AM IST
    - cron: "0,30 3-11 * * *"   # 8:30 AM - 5:00 PM IST
    - cron: "0,30 12 * * *"     # 5:30 PM and 6:00 PM IST
  workflow_dispatch: {} # lets you run it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health to keep Render awake
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 "${{ secrets.SBT_API_URL }}/api/health"
