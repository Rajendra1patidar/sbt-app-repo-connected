name: SBT Daily Cron

on:
  schedule:
    # 14:30 UTC = 20:00 IST (8 PM). GitHub Actions cron is UTC only.
    - cron: "30 14 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/run
        run: |
          response=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${{ secrets.SBT_API_URL }}/api/cron/run" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "HTTP status: $response"
          echo "Response body:"
          cat response.json
          if [ "$response" -ne 200 ]; then
            echo "Cron call failed with status $response"
            exit 1
          fi
