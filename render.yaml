services:
  - type: web
    name: sbt-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Your app address, then the customer portal address, comma-separated (no spaces needed).
      # In production, if this is empty no website can use the API from a browser. * allows every site.
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Nightly jobs and backups (see BACKUPS.md)
      - key: CRON_SECRET
        sync: false
      - key: BACKUP_PASSPHRASE
        sync: false
      - key: BACKUP_EMAIL_TO
        sync: false
      - key: TELEGRAM_REPORT_BOT_TOKEN
        sync: false
      - key: TELEGRAM_REPORT_CHAT_ID
        sync: false
