name: CI

# Runs on every push and pull request: the backend tests, and the frontend type-check + build
# (the same `npm run build` Netlify runs). A red cross on a commit means it would not have deployed cleanly.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --force matches NPM_FLAGS in netlify.toml, so CI installs exactly what Netlify installs.
      - run: npm ci --force
      # Colour contrast, 12px text and dark-mode button rules (see scripts/check-design.mjs).
      # Kept out of `npm run build` on purpose, so a style slip shows a red cross here but never blocks a deploy.
      - run: npm run check:design
      - run: npm run build
